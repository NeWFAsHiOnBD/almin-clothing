<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট - Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #f4f5f7;">

    <nav class="navbar">
        <div class="logo"><a href="index.html">Fashion<span>Store</span></a></div>
    </nav>

    <div class="container" style="max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
        <h2>অর্ডার কনফার্ম করুন</h2>
        <form id="checkout-form" style="margin-top: 20px;">
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">আপনার নাম:</label>
                <input type="text" id="c-name" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">মোবাইল নম্বর:</label>
                <input type="text" id="c-phone" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">সম্পূর্ণ ঠিকানা:</label>
                <textarea id="c-address" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; height:80px;"></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">পেমেন্ট মেথড:</label>
                <select id="c-payment" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
                    <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি (Cash on Delivery)</option>
                    <option value="bKash/Nagad">বিকাশ / নগদ (Online Payment)</option>
                </select>
            </div>
            <button type="submit" class="btn-checkout">অর্ডার প্লেস করুন</button>
        </form>
    </div>

    <script src="checkout.js"></script>
</body>
    </html>
