<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ট্র্যাক করুন - Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #f4f5f7;">

    <nav class="navbar">
        <div class="logo"><a href="index.html">Fashion<span>Store</span></a></div>
    </nav>

    <div class="container" style="max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px;">
        <h2>অর্ডার ট্র্যাকিং</h2>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <input type="text" id="track-id-input" placeholder="আপনার অর্ডার আইডি লিখুন (যেমন: ORD-XXXXXX)" style="flex-grow:1; padding:10px; border:1px solid #ddd; border-radius:4px;">
            <button onclick="trackOrder()" class="btn-checkout" style="width: auto; padding: 10px 20px;">ট্র্যাক করুন</button>
        </div>

        <div id="track-result" style="margin-top: 20px;"></div>
    </div>

    <script>
        function trackOrder() {
            const queryId = document.getElementById('track-id-input').value.trim();
            const myOrders = JSON.parse(localStorage.getItem('myOrders')) || [];
            const resultDiv = document.getElementById('track-result');

            const order = myOrders.find(o => o.orderId === queryId);

            if (!order) {
                resultDiv.innerHTML = '<p style="color:red;">দুঃখিত, এই আইডি দিয়ে কোনো অর্ডার পাওয়া যায়নি।</p>';
                return;
            }

            resultDiv.innerHTML = `
                <div style="background:#f9f9f9; padding:15px; border-radius:6px; border:1px solid #eee;">
                    <p><strong>অর্ডার আইডি:</strong> ${order.orderId}</p>
                    <p><strong>নাম:</strong> ${order.customerName}</p>
                    <p><strong>মোবাইল:</strong> ${order.phone}</p>
                    <p><strong>ঠিকানা:</strong> ${order.address}</p>
                    <p><strong>মোট মূল্য:</strong> ৳ ${order.totalAmount}</p>
                    <p><strong>বর্তমান অবস্থা:</strong> <span style="color:#f85606; font-weight:bold;">${order.status}</span></p>
                </div>
            `;
        }

        // অটো ফিল ইউআরএল আইডি
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('track-id-input').value = id;
                trackOrder();
            }
        }
    </script>
</body>
</html>
