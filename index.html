<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store - অনলাইন শপ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f9f9f9; color: #333; }
        header { background: #1d3557; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 22px; }
        .admin-btn { background: #e63946; color: #fff; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .banner { background: #457b9d; color: #fff; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 25px; }
        .banner h2 { margin-bottom: 10px; font-size: 26px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 220px; object-fit: cover; }
        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-info h3 { font-size: 16px; margin-bottom: 8px; color: #1d3557; }
        .price { font-weight: bold; color: #e63946; margin-bottom: 10px; }
        .price span { text-decoration: line-through; color: #888; font-size: 13px; margin-left: 5px; }
        .btn-order { margin-top: auto; background: #1d3557; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-order:hover { background: #457b9d; }
    </style>
</head>
<body>

    <header>
        <h1>Fashion Store</h1>
        <a href="admin.html" class="admin-btn"><i class="fa-solid fa-lock"></i> অ্যাডমিন প্যানেল</a>
    </header>

    <div class="container">
        <div class="banner">
            <h2>স্টাইলিশ ও প্রিমিয়াম পোশাকের সমাহার</h2>
            <p>আপনার পছন্দের পোশাকটি বেছে নিন খুব সহজেই!</p>
        </div>

        <h2 style="margin-bottom: 15px; color: #1d3557;">সকল প্রোডাক্ট</h2>
        <div class="product-grid" id="product-list-container">
            <!-- ডায়নামিক প্রোডাক্ট এখানে লোড হবে -->
        </div>
    </div>

    <script>
        // হোমপেজে প্রোডাক্ট দেখানোর বেসিক স্ক্রিপ্ট
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('product-list-container');
            const products = JSON.parse(localStorage.getItem('admin_products')) || [];

            if (products.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">বর্তমানে কোনো প্রোডাক্ট নেই। অ্যাডমিন প্যানেল থেকে প্রোডাক্ট যুক্ত করুন।</p>';
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.title}">
                    <div class="product-info">
                        <h3>${p.title}</h3>
                        <p style="font-size: 13px; color: #666; margin-bottom: 5px;">সাইজ: ${p.size}</p>
                        <div class="price">৳${p.price} ${p.oldPrice ? `<span>৳${p.oldPrice}</span>` : ''}</div>
                        <button class="btn-order" onclick="alert('অর্ডার সিস্টেমের কাজ চলছে!')">অর্ডার করুন</button>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
